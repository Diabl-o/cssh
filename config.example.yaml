version: 1
security:
  require_sudo: true
  allow_non_interactive: true
projects:
  - id: example
    name: Example Project
    servers:
      - id: web
        name: Production Web
        host: ec2-1-2-3-4.compute.amazonaws.com
        user: ubuntu
        group: production
        region: ap-southeast-1
        auth:
          type: pem
          secret: example-web-pem
      - id: api
        name: Production API
        host: ec2-5-6-7-8.compute.amazonaws.com
        user: ubuntu
        group: production
        region: ap-southeast-1
        auth:
          type: key
          secret: my-ed25519-key
